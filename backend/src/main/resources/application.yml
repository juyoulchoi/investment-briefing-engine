spring:
  application:
    name: investment-briefing-engine
  jpa:
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  port: 8080
krx:
  base-url: ${KRX_BASE_URL:https://data-dbg.krx.co.kr}
  auth-key: ${KRX_AUTH_KEY:}
  connect-timeout: ${KRX_CONNECT_TIMEOUT:5s}
  read-timeout: ${KRX_READ_TIMEOUT:30s}
  collection:
    min-request-interval: ${KRX_MIN_REQUEST_INTERVAL:250ms}
overseas:
  yahoo:
    base-url: ${YAHOO_FINANCE_BASE_URL:https://query2.finance.yahoo.com/v8/finance/chart}
    connect-timeout: ${YAHOO_CONNECT_TIMEOUT:5s}
    read-timeout: ${YAHOO_READ_TIMEOUT:30s}
    index:
      connect-timeout: ${YAHOO_INDEX_CONNECT_TIMEOUT:${YAHOO_CONNECT_TIMEOUT:5s}}
      read-timeout: ${YAHOO_INDEX_READ_TIMEOUT:${YAHOO_READ_TIMEOUT:30s}}
exchange-rate:
  yahoo:
    connect-timeout: ${YAHOO_EXCHANGE_CONNECT_TIMEOUT:${YAHOO_CONNECT_TIMEOUT:5s}}
    read-timeout: ${YAHOO_EXCHANGE_READ_TIMEOUT:${YAHOO_READ_TIMEOUT:30s}}
investment:
  rules:
    max-regular-buy-multiplier: 3.0
    weekly-review-day: SATURDAY
    monthly-rebalance-day: 25
external-api:
  connect-timeout: ${EXTERNAL_API_CONNECT_TIMEOUT:3s}
  read-timeout: ${EXTERNAL_API_READ_TIMEOUT:10s}
fred:
  base-url: ${FRED_BASE_URL:https://api.stlouisfed.org/fred}
  api-key: ${FRED_API_KEY:}
  connect-timeout: ${FRED_CONNECT_TIMEOUT:5s}
  read-timeout: ${FRED_READ_TIMEOUT:30s}
  collection:
    min-request-interval: ${FRED_MIN_REQUEST_INTERVAL:250ms}
  circuit-breaker:
    failure-threshold: ${FRED_CIRCUIT_FAILURE_THRESHOLD:5}
    open-duration: ${FRED_CIRCUIT_OPEN_DURATION:60s}
kofia:
  base-url: ${KOFIA_BASE_URL:https://freesis.kofia.or.kr}
  connect-timeout: ${KOFIA_CONNECT_TIMEOUT:5s}
  read-timeout: ${KOFIA_READ_TIMEOUT:30s}
  collection:
    min-request-interval: ${KOFIA_MIN_REQUEST_INTERVAL:250ms}
  circuit-breaker:
    failure-threshold: ${KOFIA_CIRCUIT_FAILURE_THRESHOLD:5}
    open-duration: ${KOFIA_CIRCUIT_OPEN_DURATION:60s}
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
