name: investment-v2

services:
  postgres:
    image: postgres:16
    container_name: investment-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: investment
      POSTGRES_USER: investment
      POSTGRES_PASSWORD: investment
    ports:
      - "5433:5432"
    volumes:
      - investment-v2-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment -d investment"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - investment-v2

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: investment-v2-backend
    container_name: investment-v2-backend
    restart: unless-stopped
    # Main과 V2가 외부 공급자 인증키의 단일 원본을 공유한다.
    env_file:
      - ../investment-briefing-engine/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/investment
      SPRING_DATASOURCE_USERNAME: investment
      SPRING_DATASOURCE_PASSWORD: investment
      KRX_BASE_URL: ${KRX_BASE_URL:-https://data-dbg.krx.co.kr}
      KRX_CONNECT_TIMEOUT: ${KRX_CONNECT_TIMEOUT:-5s}
      KRX_READ_TIMEOUT: ${KRX_READ_TIMEOUT:-30s}
      KRX_CIRCUIT_FAILURE_THRESHOLD: ${KRX_CIRCUIT_FAILURE_THRESHOLD:-5}
      KRX_CIRCUIT_OPEN_DURATION: ${KRX_CIRCUIT_OPEN_DURATION:-60s}
      KRX_EOD_PUBLICATION_ZONE: ${KRX_EOD_PUBLICATION_ZONE:-Asia/Seoul}
      KRX_EOD_PUBLICATION_TIME: ${KRX_EOD_PUBLICATION_TIME:-18:00}
      KRX_MIN_REQUEST_INTERVAL: ${KRX_MIN_REQUEST_INTERVAL:-250ms}
      YAHOO_FINANCE_BASE_URL: ${YAHOO_FINANCE_BASE_URL:-https://query2.finance.yahoo.com/v8/finance/chart}
      YAHOO_CONNECT_TIMEOUT: ${YAHOO_CONNECT_TIMEOUT:-5s}
      YAHOO_READ_TIMEOUT: ${YAHOO_READ_TIMEOUT:-30s}
      YAHOO_INDEX_CONNECT_TIMEOUT: ${YAHOO_INDEX_CONNECT_TIMEOUT:-5s}
      YAHOO_INDEX_READ_TIMEOUT: ${YAHOO_INDEX_READ_TIMEOUT:-30s}
      YAHOO_EXCHANGE_CONNECT_TIMEOUT: ${YAHOO_EXCHANGE_CONNECT_TIMEOUT:-5s}
      YAHOO_EXCHANGE_READ_TIMEOUT: ${YAHOO_EXCHANGE_READ_TIMEOUT:-30s}
      YAHOO_STOCK_CONNECT_TIMEOUT: ${YAHOO_STOCK_CONNECT_TIMEOUT:-5s}
      YAHOO_STOCK_READ_TIMEOUT: ${YAHOO_STOCK_READ_TIMEOUT:-30s}
      YAHOO_MIN_REQUEST_INTERVAL: ${YAHOO_MIN_REQUEST_INTERVAL:-250ms}
      YAHOO_CIRCUIT_FAILURE_THRESHOLD: ${YAHOO_CIRCUIT_FAILURE_THRESHOLD:-5}
      YAHOO_CIRCUIT_OPEN_DURATION: ${YAHOO_CIRCUIT_OPEN_DURATION:-60s}
      KRX_RETRY_MAX_ATTEMPTS: ${KRX_RETRY_MAX_ATTEMPTS:-4}
      KRX_RETRY_BACKOFF: ${KRX_RETRY_BACKOFF:-1s,3s,10s}
      KRX_RETRY_HTTP_STATUSES: ${KRX_RETRY_HTTP_STATUSES:-408,429,500,502,503,504}
      YAHOO_RETRY_MAX_ATTEMPTS: ${YAHOO_RETRY_MAX_ATTEMPTS:-4}
      YAHOO_RETRY_BACKOFF: ${YAHOO_RETRY_BACKOFF:-1s,3s,10s}
      YAHOO_RETRY_HTTP_STATUSES: ${YAHOO_RETRY_HTTP_STATUSES:-408,429,500,502,503,504}
      FRED_RETRY_MAX_ATTEMPTS: ${FRED_RETRY_MAX_ATTEMPTS:-4}
      FRED_RETRY_BACKOFF: ${FRED_RETRY_BACKOFF:-1s,3s,10s}
      FRED_RETRY_HTTP_STATUSES: ${FRED_RETRY_HTTP_STATUSES:-408,429,500,502,503,504}
      KOFIA_RETRY_MAX_ATTEMPTS: ${KOFIA_RETRY_MAX_ATTEMPTS:-4}
      KOFIA_RETRY_BACKOFF: ${KOFIA_RETRY_BACKOFF:-1s,3s,10s}
      KOFIA_RETRY_HTTP_STATUSES: ${KOFIA_RETRY_HTTP_STATUSES:-408,429,500,502,503,504}
      FRED_BASE_URL: ${FRED_BASE_URL:-https://api.stlouisfed.org/fred}
      FRED_CONNECT_TIMEOUT: ${FRED_CONNECT_TIMEOUT:-5s}
      FRED_READ_TIMEOUT: ${FRED_READ_TIMEOUT:-30s}
      FRED_MIN_REQUEST_INTERVAL: ${FRED_MIN_REQUEST_INTERVAL:-250ms}
      KOFIA_BASE_URL: ${KOFIA_BASE_URL:-https://freesis.kofia.or.kr}
      KOFIA_CONNECT_TIMEOUT: ${KOFIA_CONNECT_TIMEOUT:-5s}
      KOFIA_READ_TIMEOUT: ${KOFIA_READ_TIMEOUT:-30s}
      KOFIA_MIN_REQUEST_INTERVAL: ${KOFIA_MIN_REQUEST_INTERVAL:-250ms}
      KOFIA_CIRCUIT_FAILURE_THRESHOLD: ${KOFIA_CIRCUIT_FAILURE_THRESHOLD:-5}
      KOFIA_CIRCUIT_OPEN_DURATION: ${KOFIA_CIRCUIT_OPEN_DURATION:-60s}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      INVESTMENT_BRIEFING_SCHEDULER_CRON: ${V2_DAILY_CRON:--}
      INVESTMENT_BRIEFING_WEEKLY_DECISION_SCHEDULER_CRON: ${V2_WEEKLY_DECISION_CRON:--}
      INVESTMENT_BRIEFING_WEEKLY_SCHEDULER_CRON: ${V2_WEEKLY_CRON:--}
      INVESTMENT_BRIEFING_SCHEDULER_ZONE: Asia/Seoul
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - investment-v2

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: investment-v2-frontend
    container_name: investment-v2-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4174:80"
    networks:
      - investment-v2

networks:
  investment-v2:
    name: investment-v2-network

volumes:
  investment-v2-postgres-data:
    name: investment-v2-postgres-data
