name: investment
services:
  postgres:
    image: postgres:16
    container_name: investment-source-postgres
    restart: unless-stopped
    env_file: [backups/unified-db/runtime/postgres.env]
    volumes: [investment-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_owner -d investment_unified_live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases: [source-postgres]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: investment-backend:single
    container_name: investment-backend
    restart: unless-stopped
    env_file: [backups/unified-db/runtime/backend.env]
    ports: ["8081:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/kofia/datasets || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes: [./docs/krx/investor-flow:/data/investor-flow:ro]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    image: investment-frontend
    container_name: investment-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://investment-backend:8080
    ports: ["127.0.0.1:4175:3000"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  investment-data:
    external: true
    name: investment-source-postgres-data
