name: investment

services:
  postgres:
    image: postgres:16
    container_name: investment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: investment
      POSTGRES_USER: investment
      POSTGRES_PASSWORD: investment
    ports:
      - "5432:5432"
    volumes:
      - investment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment -d investment"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      investment-existing:
        aliases:
          - postgres

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: investment-backend
    container_name: investment-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/investment
      SPRING_DATASOURCE_USERNAME: investment
      SPRING_DATASOURCE_PASSWORD: investment
      KRX_AUTH_KEY: ${KRX_AUTH_KEY:-}
      KRX_BASE_URL: ${KRX_BASE_URL:-https://data-dbg.krx.co.kr}
      KRX_MIN_REQUEST_INTERVAL: ${KRX_MIN_REQUEST_INTERVAL:-250ms}
      YAHOO_FINANCE_BASE_URL: ${YAHOO_FINANCE_BASE_URL:-https://query2.finance.yahoo.com/v8/finance/chart}
      FRED_API_KEY: ${FRED_API_KEY:-}
      FRED_BASE_URL: ${FRED_BASE_URL:-https://api.stlouisfed.org/fred}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      INVESTMENT_BRIEFING_SCHEDULER_CRON: "${INVESTMENT_BRIEFING_SCHEDULER_CRON:-0 20 8 * * MON-FRI}"
      INVESTMENT_BRIEFING_WEEKLY_DECISION_SCHEDULER_CRON: "${INVESTMENT_BRIEFING_WEEKLY_DECISION_SCHEDULER_CRON:-0 20 8 * * SAT}"
      INVESTMENT_BRIEFING_WEEKLY_SCHEDULER_CRON: "${INVESTMENT_BRIEFING_WEEKLY_SCHEDULER_CRON:-0 20 8 * * SUN}"
      INVESTMENT_BRIEFING_SCHEDULER_ZONE: "${INVESTMENT_BRIEFING_SCHEDULER_ZONE:-Asia/Seoul}"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - investment-existing

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: investment-frontend
    container_name: investment-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4173:80"
    networks:
      - investment-existing

networks:
  investment-existing:
    external: true
    name: investment_default

volumes:
  investment-postgres-data:
    external: true
    name: backend_investment-postgres-data
