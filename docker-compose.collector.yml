name: investment-source

services:
  source-postgres:
    image: postgres:16
    container_name: investment-source-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: investment_source
      POSTGRES_USER: source_owner
      POSTGRES_PASSWORD: ${KOFIA_SOURCE_DB_PASSWORD:?Set KOFIA_SOURCE_DB_PASSWORD}
    volumes:
      - investment-source-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_owner -d investment_source"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [source-db]

  collector:
    build:
      context: .
      dockerfile: backend/Dockerfile.collector
    image: investment-kofia-collector
    container_name: investment-kofia-collector
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://source-postgres:5432/investment_source
      SPRING_DATASOURCE_USERNAME: source_owner
      SPRING_DATASOURCE_PASSWORD: ${KOFIA_SOURCE_DB_PASSWORD:?Set KOFIA_SOURCE_DB_PASSWORD}
      KOFIA_SHARED_COLLECTION_ENABLED: ${KOFIA_SHARED_COLLECTION_ENABLED:-false}
      KOFIA_SCHEDULER_ENABLED: ${KOFIA_SHARED_COLLECTION_ENABLED:-false}
      KOFIA_FUND_FLOW_SCHEDULER_ENABLED: ${KOFIA_SHARED_COLLECTION_ENABLED:-false}
      KOFIA_CUSTOMER_SCALE_SCHEDULER_ENABLED: ${KOFIA_SHARED_COLLECTION_ENABLED:-false}
      KOFIA_COMPANY_FUND_FLOW_SCHEDULER_ENABLED: ${KOFIA_SHARED_COLLECTION_ENABLED:-false}
      KOFIA_RECOVERY_ENABLED: ${KOFIA_SHARED_COLLECTION_ENABLED:-false}
      KOFIA_MIN_REQUEST_INTERVAL: ${KOFIA_MIN_REQUEST_INTERVAL:-250ms}
      KOFIA_EXECUTOR_POOL_SIZE: ${KOFIA_EXECUTOR_POOL_SIZE:-2}
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      source-postgres:
        condition: service_healthy
    networks:
      source-db:
      source-read:
        aliases: [kofia-collector]

networks:
  source-db:
    internal: true
  source-read:
    name: investment-source-read

volumes:
  investment-source-postgres-data:
    name: investment-source-postgres-data
